[project]
name = "advertising-analytics-pipeline"
version = "0.1.0"
description = "Advertising Analytics Data Pipeline"
authors = [
    {name = "Katarzyna Kadyszewska"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
