name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || true; fi

      - name: Static syntax check
        run: |
          if [ -d src ]; then python -m compileall src; fi
          if [ -d tests ]; then python -m compileall tests; fi

      - name: Run tests if present
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then pytest -q; else echo "No tests yet."; fi
