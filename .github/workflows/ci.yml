name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit and integration tests ──────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: ads-analytics-pipeline
          cache-environment: true
          cache-downloads: true

      - name: Compile source and tests
        shell: micromamba-shell {0}
        run: python -m compileall src tests scripts

      - name: Run test suite
        shell: micromamba-shell {0}
        run: python -m pytest -q

  # ── Job 2: End-to-end pipeline smoke test ──────────────────────────────────
  end-to-end:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: ads-analytics-pipeline
          cache-environment: true
          cache-downloads: true

      - name: Run end-to-end pipeline
        shell: micromamba-shell {0}
        run: python -m src.run_pipeline

      - name: Verify pipeline outputs
        shell: micromamba-shell {0}
        run: python scripts/verify_pipeline_outputs.py

      - name: Check deterministic report artifacts are current
        shell: micromamba-shell {0}
        run: |
          git diff --exit-code reports/campaign_report.md reports/analytics_insights.md

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            reports/campaign_report.md
            reports/analytics_insights.md
          if-no-files-found: error
          retention-days: 30
